<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gran Line del Saber</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gran Line">
<meta name="theme-color" content="#0b4f8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sea1:#0b4f8a; --sea2:#1590c9; --paper:#fbe9b7; --ink:#3b2412;
  --red:#d7263d; --gold:#f5b700; --green:#2a9d5b; --straw:#f2c94c; --wood:#8a5a2b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:Nunito,system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(180deg,#7fd3ff 0%,#bde9ff 30%,var(--sea2) 58%,var(--sea1) 100%) fixed;
  min-height:100vh; overflow-x:hidden; touch-action:manipulation;
  -webkit-user-select:none; user-select:none;
}
h1,h2,h3,.pirate{font-family:"Pirata One",Georgia,serif;font-weight:400;letter-spacing:.5px}
.wrap{max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.card{position:relative;background:var(--paper);border:4px solid var(--wood);border-radius:22px;
  box-shadow:0 7px 0 #5d3a17,0 12px 26px rgba(0,0,0,.22);padding:18px;margin-top:14px}
.btn{font:inherit;font-weight:900;font-size:18px;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;
  background:var(--red);color:#fff;box-shadow:0 5px 0 #8f1424;transition:transform .08s;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8f1424}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #a87d00}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #c9b27a}
.btn.green{background:var(--green);box-shadow:0 5px 0 #17643a}
.btn.blue{background:var(--sea1);box-shadow:0 5px 0 #062c4e}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{display:block;width:100%;text-align:left;margin-top:12px}
.btn small{display:block;font-weight:700;font-size:14px;opacity:.85}
.center{text-align:center}
.hint{font-size:15px;opacity:.8}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* Cabecera */
.hud{display:flex;align-items:center;gap:10px}
.hud .title{font-family:"Pirata One";font-size:clamp(22px,6.4vw,30px);color:#fff;text-shadow:2px 2px 0 var(--sea1);flex:1;line-height:1}
.chip{background:var(--paper);border:3px solid var(--wood);border-radius:12px;padding:5px 10px;font-weight:900;white-space:nowrap;font-size:15px}

/* Mapa */
.map svg{width:100%;height:auto;display:block}
.isl{cursor:pointer}
.isl:active{opacity:.8}
.isl-name{font-family:"Pirata One";font-size:22px;fill:var(--ink)}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.mapsea{fill:url(#seaGrad)}

/* Navegación inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);display:flex;justify-content:center;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;max-width:150px;font:inherit;font-weight:800;font-size:12px;color:var(--straw);background:none;border:0;padding:6px 2px;border-radius:12px;cursor:pointer}
.tabs button span{display:block;font-size:24px}
.tabs button.on{background:rgba(242,201,76,.18)}

/* Juego */
.bar{flex:1;height:16px;background:rgba(255,255,255,.6);border-radius:10px;overflow:hidden;border:2px solid var(--wood)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .3s}
.bar.time i{background:linear-gradient(90deg,var(--green),var(--gold));transition:width .1s linear}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--straw);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px}
.q-title{font-size:21px;font-weight:900;margin:12px 0 6px}
.q-sentence{font-size:22px;font-weight:800;background:#fff;border-radius:14px;padding:12px 14px;margin:8px 0 12px;border:2px dashed var(--wood)}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.opts.one{grid-template-columns:1fr}
.opt{font:inherit;font-size:19px;font-weight:800;background:#fff;border:3px solid #d9c18a;border-radius:14px;padding:13px 10px;cursor:pointer;color:var(--ink);min-height:56px}
.opt.ok{background:#d6f5e2;border-color:var(--green);color:#16683b}
.opt.ko{background:#ffe0e3;border-color:var(--red);color:#9b1020}
.feedback{font-weight:900;font-size:20px;margin-top:10px;min-height:28px;text-align:center}
.feedback.ok{color:var(--green)} .feedback.ko{color:var(--red)}
.video{display:block;background:#fff;border:3px solid var(--gold);border-radius:14px;padding:10px 14px;font-weight:900;color:var(--ink);text-decoration:none;margin:8px 0}

/* Batalla */
.arena{position:relative;height:150px;background:linear-gradient(180deg,#bde9ff,#1590c9);border-radius:16px;border:3px solid var(--wood);overflow:hidden;margin-top:12px}
.arena .me{position:absolute;left:10px;bottom:8px;width:90px;text-align:center}
.arena .boss{position:absolute;right:10px;bottom:4px;width:120px;text-align:center;transition:transform .2s}
.arena .boss.hit{animation:hit .5s}
@keyframes hit{20%{transform:translateX(18px) rotate(10deg)}60%{transform:translateX(-4px)}}
.arena .me.hurt{animation:hurt .5s}
@keyframes hurt{25%,75%{transform:translateX(-8px);filter:brightness(1.6) saturate(0)}50%{transform:translateX(8px)}}
.arm{position:absolute;left:70px;bottom:62px;height:16px;width:0;background:#f4c7a1;border:3px solid #b9784d;border-radius:8px;transform-origin:left}
.arm.go{animation:arm .6s ease-out}
.arm::after{content:"";position:absolute;right:-22px;top:-12px;width:34px;height:34px;border-radius:50%;background:#f4c7a1;border:3px solid #b9784d}
@keyframes arm{0%{width:0}45%{width:calc(100% - 200px)}100%{width:0}}
.hp{height:10px;background:#fff;border-radius:6px;overflow:hidden;border:2px solid var(--ink);margin-top:4px}
.hp i{display:block;height:100%;background:var(--red);transition:width .3s}
.meat{font-size:18px;letter-spacing:-2px}
.bang{position:absolute;right:90px;top:20px;font-family:"Pirata One";font-size:34px;color:var(--red);text-shadow:2px 2px 0 #fff;opacity:0}
.bang.go{animation:bang .7s}
@keyframes bang{30%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1)}}

/* Tesoros */
.poster{width:200px;margin:0 auto;background:#f3d9a0;border:6px solid #b8864b;padding:10px;box-shadow:0 6px 18px rgba(0,0,0,.3);transform:rotate(-2deg)}
.poster .wanted{font-family:"Pirata One";font-size:40px;line-height:1;text-align:center}
.poster .name{font-family:"Pirata One";font-size:21px;text-align:center}
.poster .berries{font-weight:900;font-size:19px;text-align:center}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sticker{background:#fff;border:3px solid #d9c18a;border-radius:16px;padding:8px 6px;text-align:center;font-weight:900;font-size:14px}
.sticker svg{width:64px;height:64px}
.sticker.off svg{filter:grayscale(1) brightness(.35);opacity:.35}
.sticker.off{background:#f3e6c4}
.sticker .cond{font-weight:700;font-size:11px;opacity:.75}
.ticket{position:relative;background:repeating-linear-gradient(45deg,#ffe28a,#ffe28a 10px,#ffd34d 10px,#ffd34d 20px);border:3px dashed var(--red);border-radius:14px;padding:12px;margin-top:10px;font-weight:900}
.ticket.used{filter:grayscale(1);opacity:.55}
.medals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-size:12px;font-weight:800}
.medals div span{display:block;font-size:30px}
.pieces{font-size:30px;letter-spacing:4px}

/* Modales y animaciones */
.modal{position:fixed;inset:0;z-index:50;background:rgba(11,35,60,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{max-width:420px;width:100%;margin:0}
.pop{animation:pop .6s}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.spin-in{animation:spinin 1s}
@keyframes spinin{0%{transform:rotate(-540deg) scale(0)}100%{transform:none}}
.confetti{position:fixed;top:-30px;font-size:26px;z-index:60;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#fx{position:fixed;inset:0;z-index:70;overflow:hidden;display:none;background:linear-gradient(180deg,#7fd3ff,#bde9ff 55%,#1590c9 56%,#0b4f8a)}
#fx.on{display:block}
#fx .cap{position:absolute;left:0;right:0;top:calc(14% + env(safe-area-inset-top));text-align:center;font-family:"Pirata One";font-size:44px;color:#fff;text-shadow:3px 3px 0 var(--red),0 0 18px rgba(0,0,0,.3);padding:0 12px}
#fx .tapclose{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-weight:900;opacity:.85}
.fx-ship{position:absolute;bottom:34%;left:-260px;width:240px;animation:sail 5s linear forwards}
.fx-ship svg{animation:bob 1.2s ease-in-out infinite}
@keyframes sail{to{left:110vw}}
.fx-waves{position:absolute;left:0;bottom:0;width:200%;height:46%;animation:wave 6s linear infinite}
@keyframes wave{to{transform:translateX(-50%)}}
.fx-fist{position:absolute;top:52%;left:0;height:30px;width:0;background:#f4c7a1;border:4px solid #b9784d;border-radius:14px;animation:pistol 1.6s ease-in .4s forwards}
.fx-fist::after{content:"";position:absolute;right:-40px;top:-22px;width:64px;height:64px;border-radius:50%;background:#f4c7a1;border:4px solid #b9784d}
.fx-fist::before{content:"";position:absolute;left:-4px;top:-14px;width:70px;height:50px;background:var(--red);border-radius:10px}
@keyframes pistol{60%{width:72vw}100%{width:72vw}}
.fx-target{position:absolute;top:calc(52% - 40px);right:6vw;width:100px;animation:fly 1s ease-in 1.4s forwards}
@keyframes fly{to{transform:translate(60vw,-70vh) rotate(900deg)}}
.fx-chest{position:absolute;left:50%;top:42%;width:180px;margin-left:-90px;animation:pop .8s}
.fx-hat{position:absolute;width:130px;animation:hatfly 4.6s ease-in-out forwards}
@keyframes hatfly{0%{left:-150px;top:70%;transform:rotate(0)}25%{left:60vw;top:30%;transform:rotate(200deg)}50%{left:10vw;top:20%;transform:rotate(380deg)}75%{left:70vw;top:55%;transform:rotate(560deg)}100%{left:calc(50vw - 65px);top:40%;transform:rotate(720deg) scale(1.4)}}
.fx-flag{position:absolute;left:50%;top:38%;width:220px;margin-left:-110px;animation:spinin 1.2s,flag 1.4s ease-in-out 1.2s infinite}
@keyframes flag{50%{transform:skewY(6deg) scale(1.05)}}
#fxCanvas{position:absolute;inset:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.wchip{font:inherit;font-weight:900;font-size:20px;padding:10px 14px;border-radius:12px;border:3px solid var(--wood);background:#fff;cursor:pointer;color:var(--ink)}
.wchip.used{opacity:.25;pointer-events:none}
.slots{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;background:rgba(255,255,255,.6);border:3px dashed var(--wood);border-radius:14px;padding:8px}
.slots.good{border-color:var(--green);background:#d6f5e2}.slots.bad{border-color:var(--red);background:#ffe0e3}
.slot{background:var(--straw);border-radius:10px;padding:8px 12px;font-weight:900;font-size:19px;cursor:pointer}
.slot:last-child{animation:pop .3s}
.opt,.wchip,.btn{transition:transform .1s}
.opt:active,.wchip:active{transform:scale(.94)}
.opt.ok{animation:pop .5s}
.parrot{display:flex;align-items:flex-end;gap:8px;margin-top:12px;position:relative}
.parrot .bird{animation:bob 2s ease-in-out infinite;flex:none}
.bubble{background:#fff;border:3px solid var(--wood);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:900;font-size:17px;flex:1}
.bubble.talk{animation:pop .45s}
.combo{position:absolute;right:6px;top:-18px;background:var(--red);color:#fff;font-weight:900;border-radius:999px;padding:4px 10px;animation:pop .4s}
.x2{margin-top:8px;text-align:center;background:linear-gradient(90deg,#f5b700,#ffe28a,#f5b700);border:3px solid #a87d00;border-radius:12px;font-weight:900;padding:4px}
.sea-bonus{background:#fff4c9}
.isl .islin{transition:transform .15s}
.isl:active .islin{transform:scale(.9)}
.flag{animation:flagw 1.6s ease-in-out infinite;transform-origin:22px -53px}
@keyframes flagw{50%{transform:scaleX(.8)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:420px){.opt{font-size:17px}.q-sentence{font-size:19px}#fx .cap{font-size:36px}}
@media (prefers-reduced-motion:reduce){.bob,.fx-waves,.fx-flag{animation:none}}
</style>
</head>

// Multiplicaciones generadas (tablas del 2 al 10 + problemas piratas)
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function genMat(){
  const a = rnd(2,10), b = rnd(2,10), p = a*b, r = Math.random();
  let q, s, ans;
  if (r < .55){ q = "¿Cuánto es?"; s = `${a} × ${b} = ?`; ans = p; }
  else if (r < .75){ q = "¿Qué número falta?"; s = `${a} × ? = ${p}`; ans = b; }
  else {
    const P = [
      `Luffy come ${a} platos de carne al día. ¿Cuántos come en ${b} días?`,
      `Zoro tiene ${a} cajas con ${b} espadas cada una. ¿Cuántas espadas hay?`,
      `Nami dibuja ${b} mapas cada semana. ¿Cuántos dibuja en ${a} semanas?`,
      `Hay ${a} barcos con ${b} piratas en cada uno. ¿Cuántos piratas hay?`,
      `Sanji prepara ${a} bandejas con ${b} pasteles. ¿Cuántos pasteles hay?`,
    ];
    q = "Problema pirata:"; s = P[rnd(0,P.length-1)]; ans = p;
  }
  const opts = new Set([ans]);
  const cand = r >= .55 && r < .75 ? [b+1,b-1,b+2,a] : [p+a,p-a,p+b,p-b,p+1,p-1,a+b];
  for (const c of shuffle(cand)) { if (opts.size >= 4) break; if (c > 0) opts.add(c); }
  return {q, s, o:[...opts].map(String), a:String(ans)};
}

let silentEl = null;
function silentWav(){
  const n = 800, b = new ArrayBuffer(44 + n*2), v = new DataView(b), w = (o, t) => [...t].forEach((c,i) => v.setUint8(o+i, c.charCodeAt(0)));
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,16000,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b], {type:"audio/wav"}));
}
function unlockAudio(){
  if (!S.sound) return;

    if (silentEl.paused) silentEl.play().catch(()=>{});
  } catch(e){}
  try { const c = ac(), src = c.createBufferSource(); src.buffer = c.createBuffer(1, 1, 22050); src.connect(c.destination); src.start(0); } catch(e){}

}

function tone(f, d, {type="triangle", vol=.18, at=0, slide=0, attack=.005, music=false}={}){
  if (!S.sound) return;
  try { const c = ac(), t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(music ? bus() : c.destination); o.start(t); o.stop(t + d + .05); } catch(e){}
}
function noise(d, {vol=.4, at=0, freq=800}={}){
  if (!S.sound) return;
  try { const c = ac(), t = c.currentTime + at, buf = c.createBuffer(1, c.sampleRate*d, c.sampleRate), data = buf.getChannelData(0);
    for (let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start(t); } catch(e){}
}

    const status = done ? `✅ Terminado${nota ? " · Nota " + nota : ""}` : n ? `⏳ A medias (${n} respuestas)` : "🆕 Sin empezar";
    return `<div class="card" style="margin-top:12px">
      <div class="spread"><div><h3 style="margin:0;font-size:26px">${esc(e.name)}</h3><span class="hint">${esc(e.sub)}</span></div>${icon("chest",56,46)}</div>
      <p style="margin:8px 0;font-weight:800">${status}</p>
      <a class="btn" href="${e.file}">${done ? "Ver / repetir" : n ? "Continuar" : "Empezar"} ⚓</a></div>`;
  }).join("");
  app.innerHTML = `${hud()}
    <div class="card center"><h2 style="margin:0;font-size:34px">🏰 Isla de los Exámenes</h2>
      <p style="margin:6px 0 0">Exámenes de verdad, sacados de tus fichas del cole.<br><b>Nota 7 o más = 🎬 vale por un capítulo</b> y muchos berries.</p></div>
    ${rows}
    <button class="btn ghost" style="margin-top:16px" onclick="go('map')">◀ Volver al mapa</button>`;
}
function checkExams(){
  const unlocked = [];
  EXAMS.forEach(e => {
    const d = examData(e);
    if (!d || !d.finished) return;
    const tag = String(d.at||0);
    if (S.exams[e.key] && S.exams[e.key].at === tag) return;
    const nota = d.total ? d.score/d.total*10 : null;
    S.exams[e.key] = {at:tag, nota};
    S.berries += d.total ? d.score * 20e6 : 100e6;
    if (nota != null && nota >= 7){ S.tickets.earned++; unlocked.push(`🎬 ¡Vale por un capítulo por tu ${esc(e.name)} (nota ${nota.toFixed(1).replace(".",",")})!`); }
  });
  if (unlocked.length){ save(); afterRewards(unlocked); }
  else save();
}

// ---------------- JUEGO ----------------
let timer = null;
function stopTimer(){ if (timer){ clearInterval(timer); timer = null; } }
function drawQ(id, excludeVideo){
  if (id === "mat") return genMat();
  const pool = BANK[id].filter(q => !(excludeVideo && (q.v || (G && G.mode === "crono" && q.t === "order"))));
  const recent = G ? G.seen : [];
  const fresh = pool.filter(q => !recent.includes(q));
  const from = fresh.length ? fresh : pool;
  return from[Math.floor(Math.random()*from.length)];
}
function startGame(mode){
  const id = S.lastIsland;
  G = {id, mode, i:0, ok:0, ko:0, combo:0, seen:[], list:null, built:[], lives:3, boss:8, bossMax:8, locked:false, newUnlocks:[]};
  if (mode === "aventura"){
    if (id === "mat") G.list = Array.from({length:10}, genMat);
    else {
      const vids = shuffle(BANK[id].filter(q => q.v)).slice(0,1);
      G.list = shuffle(shuffle(BANK[id].filter(q => !q.v)).slice(0, 10 - vids.length).concat(vids));
    }
  }
  if (mode === "repaso") G.list = shuffle(S.wrong[id] || []).slice(0, 10);
  if (mode === "crono"){ G.end = Date.now() + 60000;
    timer = setInterval(() => { const left = Math.max(0, G.end - Date.now());
      const bar = document.getElementById("tbar"); if (bar) bar.style.width = (left/600)+"%";
      const tl = document.getElementById("tleft"); if (tl) tl.textContent = Math.ceil(left/1000)+" s";
      if (!left){ stopTimer(); finish(); } }, 100);
  }
  nextQ(); screen = "game"; render(); window.scrollTo({top:0});
  mode === "batalla" ? sHorn() : sBell();
}
function nextQ(){
  const q = G.list ? G.list[G.i] : drawQ(G.id, true);
  G.q = q; G.built = [];
  if (q.t === "order"){ let w; do { w = shuffle(q.w); } while (w.join() === q.w.join()); G.opts = w; }
  else G.opts = (G.id === "mat" || q.o.length > 4) ? shuffle(q.o) : q.o.slice();
  G.seen.push(q); if (G.seen.length > 12) G.seen.shift();
  G.locked = false;
}
function renderGame(){
  const s = SUBJ[G.id], q = G.q;
  let top = "";
  if (G.mode === "crono") top = `<div class="bar time"><i id="tbar" style="width:100%"></i></div><span class="chip" id="tleft">60 s</span><span class="chip">✅ ${G.ok}</span>`;
  else if (G.mode === "batalla") top = `<span class="chip">✅ ${G.ok}</span>`;
  else top = `<div class="bar"><i style="width:${G.i/G.list.length*100}%"></i></div><span class="chip">${G.i+1}/${G.list.length}</span>`;
  const arena = G.mode !== "batalla" ? "" : `
    <div class="arena">
      <div class="me" id="me">${icon("hat",80,44)}<div class="meat">${"🍖".repeat(G.lives)}${"🦴".repeat(3-G.lives)}</div><b style="font-size:10px">CaptainLukiLufy</b></div>
      <div class="arm" id="arm"></div><div class="bang" id="bang">¡POW!</div>
      <div class="boss" id="boss"><svg width="96" height="96" style="color:${s.bossColor}"><use href="#monster"/></svg>
        <div class="hp"><i style="width:${G.boss/G.bossMax*100}%"></i></div><b style="font-size:11px">${esc(s.boss)}</b></div>
    </div>`;
  const vid = q.v ? `<a class="video" href="${q.v.url}" target="_blank" rel="noopener">▶ Ver «${esc(q.v.t)}» (en inglés, ~2 min)</a>` : "";
  const long = G.opts.some(o => o.length > 16);
  const body = q.t === "order"
    ? `<div class="chips">${G.opts.map((w,k) => `<button class="wchip ${G.built.includes(k)?"used":""}" onclick="tapWord(${k})">${esc(w)}</button>`).join("")}</div>
       <div class="slots" id="slots">${G.built.length ? G.built.map((k,n) => `<span class="slot" onclick="untap(${n})">${esc(G.opts[k])}</span>`).join("") : `<span class="hint">Toca las palabras en orden…</span>`}</div>`
    : `<div class="opts ${long?"one":""}">${G.opts.map((o,k) => `<button class="opt" onclick="answer(${k})">${esc(o)}</button>`).join("")}</div>`;
  app.innerHTML = `
    <div class="hud" style="margin-top:4px"><button class="btn ghost" style="padding:6px 12px;font-size:15px" onclick="quitGame()">✕</button>${top}</div>
    ${SUBJ[G.id].zone === "bonus" ? `<div class="x2">💎 Mar del Tesoro: ¡berries x2!</div>` : ""}
    ${arena}
    <div class="card">
      <span class="tag">${s.emoji} ${esc(s.short)} · ${({aventura:"Aventura",crono:"Contrarreloj",batalla:"Batalla",repaso:"Repaso"})[G.mode]}</span>
      <div class="q-title">${esc(q.q)}</div>
      ${q.s ? `<div class="q-sentence">${esc(q.s)}</div>` : ""}
      ${vid}
      ${body}
      <div class="feedback" id="fb"></div>
    </div>
    <div class="parrot"><div class="bird">${icon("parrot",62,62)}</div><div class="bubble" id="say">${esc(G.say || sayStart())}</div>${G.combo>=2?`<div class="combo">🔥 x${G.combo}</div>`:""}</div>`;
}
function quitGame(){ if (G && (G.ok + G.ko) > 0 && !confirm("¿Salir de la partida? No contará.")) return; stopTimer(); G = null; screen = "island"; render(); }

function wrongKey(q){ return q.q + "|" + (q.s||"") + "|" + q.a; }
function tapWord(k){
  if (!G || G.locked || G.built.includes(k)) return;
  G.built.push(k); tone(330 + G.built.length*70, .09, {type:"sine", vol:.15}); renderGame();
  if (G.built.length === G.opts.length) answer(-1);
}
function untap(n){ if (!G || G.locked) return; G.built.splice(n,1); renderGame(); }
const SAY_OK = ["¡Croac! ¡Eso es!","¡Qué crack, CaptainLukiLufy!","¡Toma ya! 💥","¡Berries para el capitán!","¡Ni Zoro se pierde tan poco!","¡Eres un genio pirata!"];
const SAY_KO = ["¡Ups! Mira la buena 👀","¡No pasa nada, otra!","Hasta Luffy se equivoca 😅","¡Ánimo, capitán!"];
function sayStart(){ return ["¡Vamos, CaptainLukiLufy! ¡Tú puedes!","¡Leva anclas! ⚓","Lee con calma, pirata 🦜"][G.i % 3]; }
function answer(k){
  if (!G || G.locked) return; G.locked = true;
  const q = G.q, isOrder = q.t === "order";
  const pick = isOrder ? G.built.map(j => G.opts[j]).join(" ") : G.opts[k];
  if (isOrder) q.a = q.w.join(" ");
  const ok = pick === q.a;
  if (isOrder){ const sl = document.getElementById("slots"); sl.classList.add(ok ? "good" : "bad");
    if (!ok) sl.insertAdjacentHTML("afterend", `<div class="q-sentence" style="font-size:18px">✔ ${esc(q.a)}</div>`); }
  else { const btns = app.querySelectorAll(".opt");
    btns[k].classList.add(ok ? "ok" : "ko");
    if (!ok) btns[G.opts.indexOf(q.a)].classList.add("ok"); }
  G.combo = ok ? G.combo + 1 : 0;
  G.say = ok ? (G.combo >= 3 ? `¡COMBO x${G.combo}! 🔥 +5 M extra` : SAY_OK[Math.floor(Math.random()*SAY_OK.length)]) : SAY_KO[Math.floor(Math.random()*SAY_KO.length)];
  const say = document.getElementById("say"); if (say){ say.textContent = G.say; say.classList.remove("talk"); void say.offsetWidth; say.classList.add("talk"); }
  const fb = document.getElementById("fb");
  const st = S.stats[G.id] = S.stats[G.id] || {ok:0, ko:0, miss:{}};
  const wl = S.wrong[G.id] = S.wrong[G.id] || [];
  const key = wrongKey(q);
  if (ok){
    const mult = SUBJ[G.id].zone === "bonus" ? 2 : 1;
    G.ok++; st.ok++; S.totalOk++; S.berries += 10e6 * mult + (G.combo >= 3 ? 5e6 : 0); sOk();
    fb.className = "feedback ok"; fb.textContent = ["¡Correcto! 🎉","¡Genial! ⭐","¡Así se hace, pirata! 🏴‍☠️","¡Bingo! 💰"][G.ok % 4];
    if (G.mode === "repaso"){ const j = wl.findIndex(x => wrongKey(x) === key); if (j >= 0){ wl.splice(j,1); S.fixed++; } }
  } else {
    G.ko++; st.ko++; sKo();
    st.miss = st.miss || {}; st.miss[key] = (st.miss[key]||0) + 1;
    if (G.id !== "mat" || wl.length < 30){ if (!wl.some(x => wrongKey(x) === key)) wl.push(q.t === "order" ? {t:"order", q:q.q, w:q.w} : {q:q.q, s:q.s, o:q.o, a:q.a, v:q.v}); }
    fb.className = "feedback ko"; fb.textContent = "¡Casi! La buena era: " + q.a;
    app.querySelector(".card").classList.add("shake");
  }
  save();
  let wait = ok ? 900 : (isOrder ? 2600 : 1900);
  if (G.mode === "crono") wait = ok ? 350 : 1100;
  if (G.mode === "batalla"){
    const arm = document.getElementById("arm"), boss = document.getElementById("boss"), me = document.getElementById("me");
    if (ok){ G.boss--; arm.classList.add("go"); sBoing(); setTimeout(()=>{ sCannon(); boss.classList.add("hit"); document.getElementById("bang").classList.add("go"); }, 260); }
    else { G.lives--; me.classList.add("hurt"); setTimeout(sSplash, 150); }
    wait = ok ? 1100 : 1900;
  }
  setTimeout(() => {
    if (!G) return;
    if (G.mode === "crono" && Date.now() >= G.end) return;
    if (G.mode === "batalla" && (G.boss <= 0 || G.lives <= 0)) return finish();
    G.i++;
    if (G.list && G.i >= G.list.length) return finish();
    G.say = null; nextQ(); renderGame();
  }, wait);
}

function finish(){
  stopTimer();
  const id = G.id, msgs = [];
  let good = false, piece = 0;
  if (G.mode === "aventura"){
    const n = G.list.length, stars = G.ok >= n-1 ? 3 : G.ok >= n*.7 ? 2 : G.ok >= n/2 ? 1 : 0;
    G.stars = stars; good = stars >= 2;
    if (stars > (S.stars[id]||0)){ S.stars[id] = stars; msgs.push(`¡Nuevo récord en ${SUBJ[id].short}: ${"⭐".repeat(stars)}!`); }
    if (stars === 3) piece++;
  }
  if (G.mode === "crono"){
    good = G.ok >= 8;
    if (G.ok > (S.crono[id]||0)){ S.crono[id] = G.ok; msgs.push(`¡Nuevo récord de contrarreloj: ${G.ok}!`); }
    if (G.ok >= 12) piece++;
  }
  if (G.mode === "batalla"){
    G.won = G.boss <= 0; good = G.won;
    if (G.won){ S.wins[id] = (S.wins[id]||0) + 1; piece += SUBJ[id].zone === "bonus" ? 2 : 1; S.berries += 50e6; msgs.push(`¡Has derrotado a ${SUBJ[id].boss}! +50 M de berries`); }
  }
  if (G.mode === "repaso"){ good = G.ok >= G.ko; if (!(S.wrong[id]||[]).length) msgs.push("¡Chopper ha curado todos tus errores de esta isla! 🩺"); }
  if (piece){ S.pieces += piece; msgs.push("🧩 ¡Has ganado una pieza de mapa!"); }
  while (S.pieces >= PIECES_PER_TICKET){ S.pieces -= PIECES_PER_TICKET; S.tickets.earned++; msgs.push("🎬 ¡Mapa completo! ¡VALE POR UN CAPÍTULO DE ONE PIECE!"); }
  S.games++;
  const t = today(), y = new Date(Date.now()-864e5).toLocaleDateString("sv");
  if (S.streak.last !== t){ S.streak.days = S.streak.last === y ? S.streak.days + 1 : 1; S.streak.last = t; }
  G.msgs = msgs; G.good = good;
  save();
  screen = "end"; render(); window.scrollTo({top:0});
  if (good) sWin(); else sHorn();
  afterRewards([], good);
}

function renderEnd(){
  const s = SUBJ[G.id];
  let big = "", title = "";
  if (G.mode === "aventura"){ title = ["¡Sigue entrenando!","¡Bien hecho!","¡Muy bien!","¡PERFECTO!"][G.stars]; big = `<div style="font-size:54px">${"⭐".repeat(G.stars)}${"☆".repeat(3-G.stars)}</div><b>${G.ok} de ${G.list.length} correctas</b>`; }
  if (G.mode === "crono"){ title = G.ok >= 12 ? "¡Velocidad de goma!" : "¡Tiempo!"; big = `<div style="font-size:60px;font-weight:900">${G.ok}</div><b>aciertos en 60 segundos</b>`; }
  if (G.mode === "batalla"){ title = G.won ? "¡VICTORIA!" : "¡Retirada!"; big = G.won ? `<div class="spin-in">${icon("jolly",120,120)}</div>` : `<div><svg width="110" height="110" style="color:${s.bossColor}"><use href="#monster"/></svg></div><b>${esc(s.boss)} ha ganado esta vez. ¡Revancha!</b>`; }
  if (G.mode === "repaso"){ title = "¡Repaso hecho!"; big = `<b>${G.ok} curadas · ${G.ko} por repasar</b>`; }
  app.innerHTML = `
    <div class="card center pop">
      <h1 style="font-size:42px;margin:4px 0;color:var(--red)">${title}</h1>

      <p style="font-weight:900;margin:12px 0 0">💰 Berries totales: ${fmtB(S.berries)}</p>
      ${G.msgs.map(m => `<p style="font-weight:800;margin:6px 0">${m}</p>`).join("")}
      <p class="pieces">${"🧩".repeat(S.pieces)}${"▫️".repeat(PIECES_PER_TICKET - S.pieces)}</p>
      <div class="row" style="justify-content:center">
        <button class="btn" onclick="startGame('${G.mode === "repaso" && !(S.wrong[G.id]||[]).length ? "aventura" : G.mode}')">Otra vez 🔁</button>
        <button class="btn ghost" onclick="screen='island';render()">A la isla</button>
      </div>
    </div>`;
}

// ---------------- RECOMPENSAS: cromos, rangos, animaciones ----------------
function afterRewards(extra, celebrate){
  const queue = [];
  extra.forEach(m => queue.push({title:"¡Premio!", html:`<p style="font-size:20px;font-weight:900">${m}</p>${icon("chest",120,98,"spin-in")}`}));
  CREW.forEach(c => {
    if (!S.stickers.includes(c.id) && c.ok(S)){
      S.stickers.push(c.id);
      queue.push({title:"¡Nuevo miembro de la tripulación!", html:`<div class="spin-in">${icon(c.sym,130,130)}</div><h2 style="font-size:40px;margin:6px 0">${esc(c.name)}</h2><p class="hint">${esc(c.cond)} ✔</p>`});
    }
  });
  const r = rankIdx(S.berries);
  if (r > S.rank){
    S.rank = r;
    const an = ANIMS.find(a => a.rank === r);
    queue.push({title:"¡Tu recompensa sube!", html:`<div class="poster pop" style="width:170px"><div class="wanted" style="font-size:34px">WANTED</div>${icon("jolly",120,120)}<div class="name" style="font-size:24px">CaptainLukiLufy</div><div class="berries">฿ ${fmtB(S.berries)}</div></div>
      <h2 style="font-size:30px;margin:12px 0 0">Nuevo rango: ${RANKS[r].n}</h2>${an ? `<p><b>🎬 Animación desbloqueada: ${an.name}</b></p>` : ""}`, anim: an && an.id});
  }
  save();
  const next = () => {
    const m = queue.shift();
    if (!m){ if (celebrate) playAnim(randomAnim()); return; }
    sCoins(); setTimeout(sJingle, 250); confetti();
    showModal(`<h2 style="margin:0 0 8px;font-size:30px">${m.title}</h2>${m.html}`, () => m.anim ? playAnim(m.anim, next) : next());
  };
  next();
}
function unlockedAnims(){ return ANIMS.filter(a => a.rank <= rankIdx(S.berries)); }
function randomAnim(){ const u = unlockedAnims(); return u[Math.floor(Math.random()*u.length)].id; }

function confetti(){

// ---------------- ANIMACIONES ("Cine del barco") ----------------
let fxDone = null, fxTimer = null, fxRAF = null;
const WAVES = `<svg class="fx-waves" viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 40 Q75 0 150 40 T300 40 T450 40 T600 40 T750 40 T900 40 T1050 40 T1200 40 V200 H0Z" fill="#0b4f8a" opacity=".9"/></svg>`;
function playAnim(id, done){
  const fx = document.getElementById("fx");
  fxDone = done || null; fx.className = "on";
  let html = "", dur = 5200;
  if (id === "sail") html = `${WAVES}<div class="fx-ship">${icon("ship",240,200)}</div><div class="cap">¡Zarpamos!</div>`;
  if (id === "gomu") html = `${WAVES}<div class="fx-fist"></div><div class="fx-target">${icon("marine",100,100)}</div><div class="cap">¡GOMU GOMU NO…<br>PISTOL!</div>`, dur = 4200;
  if (id === "coins"){ html = `${WAVES}<div class="fx-chest">${icon("chest",180,146)}</div><div class="cap">¡Lluvia de berries!</div>`; setTimeout(() => rain(["💰","🪙","💎","👑"], 50), 300); }
  if (id === "hat") html = `${WAVES}<div class="fx-hat">${icon("hat",130,72)}</div><div class="cap">¡Mi tesoro: el sombrero de paja!</div>`;
  if (id === "fire"){ html = `${WAVES}<canvas id="fxCanvas"></canvas><div class="cap">¡Fiesta en el barco!</div>`; dur = 6000; }
  if (id === "king"){ html = `${WAVES}<div class="fx-flag">${icon("jolly",220,220)}</div><div class="cap">¡SERÉ EL REY<br>DE LOS PIRATAS!</div>`; setTimeout(() => rain(["⭐","👑","🏴‍☠️"], 40), 900); dur = 6000; }
  fx.innerHTML = html + `<div class="tapclose">Toca para cerrar</div>`;
  if (id === "fire") fireworks();
  if (id === "gomu"){ setTimeout(sBoing, 400); setTimeout(sCannon, 1500); }
  if (id === "sail"){ sBell(); setTimeout(sHorn, 600); setTimeout(sSplash, 1500); }
  if (id === "coins"){ for (let k=0;k<8;k++) setTimeout(sCoins, 300 + k*280); }
  if (id === "hat") { sSplash(); setTimeout(() => tone(400,1.5,{type:"sine",vol:.12,slide:900}), 200); }
  if (id === "fire"){ for (let k=0;k<9;k++) setTimeout(() => { tone(600,.4,{type:"sine",vol:.08,slide:1400}); setTimeout(() => noise(.5,{vol:.35,freq:2500}), 380); }, k*620); }

function closeFx(){
  const fx = document.getElementById("fx"); if (!fx.classList.contains("on")) return;
  clearTimeout(fxTimer); cancelAnimationFrame(fxRAF); fx.className = ""; fx.innerHTML = "";

}
function rain(set, n){
  for (let k=0;k<n;k++){ const d = document.createElement("div"); d.className = "confetti"; d.style.zIndex = 80;
    d.textContent = set[k % set.length]; d.style.left = Math.random()*100+"vw"; d.style.animationDelay = Math.random()*2+"s";
    document.body.appendChild(d); setTimeout(()=>d.remove(), 5000); }
}
function fireworks(){
  const c = document.getElementById("fxCanvas"), ctx = c.getContext("2d");
  const W = c.width = innerWidth, H = c.height = innerHeight, parts = [];
  const cols = ["#f5b700","#d7263d","#fff","#3fbf5f","#8e44ad","#4fb3e8"];
  let f = 0;
  (function tick(){
    if (f % 28 === 0){ const x = W*(.2+.6*Math.random()), y = H*(.15+.3*Math.random()), col = cols[f%cols.length];
      for (let k=0;k<50;k++){ const a = Math.random()*6.28, v = 1+Math.random()*4; parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:60,col}); } }
    ctx.clearRect(0,0,W,H);
    for (let k=parts.length-1;k>=0;k--){ const p = parts[k]; p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.l--;
      ctx.globalAlpha = Math.max(0,p.l/60); ctx.fillStyle = p.col; ctx.fillRect(p.x,p.y,3,3); if (p.l<=0) parts.splice(k,1); }
    f++; fxRAF = requestAnimationFrame(tick);
  })();
}

// ---------------- TESOROS ----------------
function renderTreasure(){
  const r = rankIdx(S.berries), nx = RANKS[r+1];

  const tickets = Array.from({length:avail}, (_,k) => `<div class="ticket"><div class="spread"><span>🎬 VALE POR 1 CAPÍTULO<br>DE ONE PIECE</span><button class="btn" style="font-size:15px;padding:8px 12px" onclick="redeem()">Canjear</button></div></div>`).join("")
    + S.tickets.redeemed.slice(-3).reverse().map(d => `<div class="ticket used">🎬 Vale canjeado el ${esc(d)}</div>`).join("");
  const album = CREW.map(c => { const on = S.stickers.includes(c.id);
    return `<div class="sticker ${on?"":"off"}">${icon(c.sym,64,64)}<div>${on?esc(c.name):"???"}</div>${on?"":`<div class="cond">${esc(c.cond)}</div>`}</div>`; }).join("");
  const medals = Object.keys(SUBJ).map(id => `<div><span>${medal(id)}</span>${SUBJ[id].short}</div>`).join("");
  app.innerHTML = `${hud()}
    <div class="card center">
      <div class="poster"><div class="wanted">WANTED</div>
        <div style="background:#fff7e0;border:3px solid #b8864b;margin:6px 0;padding:6px">${icon("jolly",130,130)}</div>
        <div class="name">CaptainLukiLufy</div><div class="berries">฿ ${fmtB(S.berries)}</div></div>
      <h2 style="font-size:30px;margin:16px 0 4px">${RANKS[r].n}</h2>
      ${nx ? `<div class="bar" style="height:14px;margin:6px 20px"><i style="width:${Math.min(100,(S.berries-RANKS[r].b)/(nx.b-RANKS[r].b)*100)}%"></i></div><p class="hint" style="margin:4px 0 0">Siguiente rango: ${nx.n} (${fmtB(nx.b)})</p>` : `<p>¡Has llegado a lo más alto! 👑</p>`}
    </div>
    <div class="card"><h2 style="margin:0;font-size:28px">🎬 Vales de capítulo</h2>
      <p class="hint" style="margin:4px 0">Completa mapas 🧩 (${S.pieces}/${PIECES_PER_TICKET}) o saca 7+ en un examen. Papá o mamá los canjean con el código.</p>
      <p class="pieces" style="margin:4px 0">${"🧩".repeat(S.pieces)}${"▫️".repeat(PIECES_PER_TICKET - S.pieces)}</p>
      ${tickets || `<p class="hint">Todavía no tienes vales. ¡A navegar!</p>`}
    </div>
    <div class="card"><h2 style="margin:0 0 8px;font-size:28px">🏅 Medallas por materia</h2><div class="medals">${medals}</div></div>
    <div class="card"><h2 style="margin:0 0 8px;font-size:28px">🏴‍☠️ Mi tripulación (${S.stickers.length}/${CREW.length})</h2><div class="album">${album}</div></div>`;
}
function redeem(){
  askPin(() => { S.tickets.redeemed.push(new Date().toLocaleDateString("es-ES")); save(); render();
    showModal(`<h2 style="font-size:34px;margin:0">¡A ver un capítulo! 🍿</h2>${icon("ship",160,134,"bob")}`, () => playAnim("sail"), "¡Vamos!"); });
}

  app.innerHTML = `${hud()}
    <div class="card"><h2 style="margin:0;font-size:32px">🎬 Cine del barco</h2>
      <p class="hint" style="margin:4px 0 0">Animaciones que se desbloquean al subir de rango.</p>
      ${ANIMS.map(a => { const on = a.rank <= r;

// ---------------- FAMILIA ----------------
function renderFamily(){
  if (!familyOpen){
    app.innerHTML = `${hud()}<div class="card center"><h2 style="margin:0;font-size:30px">🔒 Zona de la familia</h2>
      <p>Estadísticas, errores frecuentes y vales.</p><button class="btn" onclick="askPin(()=>{familyOpen=true;render()})">Entrar con código</button></div>`;
    return;
  }
  const subj = Object.keys(SUBJ).map(id => {
    const st = S.stats[id] || {ok:0, ko:0, miss:{}}, tot = st.ok + st.ko;
    const top = Object.entries(st.miss||{}).sort((a,b)=>b[1]-a[1]).slice(0,5)
      .map(([k,n]) => { const [q,s,a] = k.split("|"); return `<li>${esc(s||q)} → <b>${esc(a)}</b> <span class="hint">(${n}×)</span></li>`; }).join("");
    return `<div class="card" style="margin-top:10px"><div class="spread"><b style="font-size:19px">${SUBJ[id].emoji} ${SUBJ[id].short}</b><span>${medal(id)} ${"⭐".repeat(S.stars[id]||0)}</span></div>
      <p style="margin:6px 0">Preguntas: <b>${tot}</b> · Acierto: <b>${tot?Math.round(st.ok/tot*100):0}%</b> · Errores pendientes: <b>${(S.wrong[id]||[]).length}</b></p>
      ${top ? `<div class="hint">Lo que más falla:</div><ul style="margin:4px 0 0;padding-left:20px">${top}</ul>` : ""}</div>`;
  }).join("");
  const exams = EXAMS.map(e => { const x = S.exams[e.key]; return `<li>${esc(e.name)}: ${x ? (x.nota != null ? "nota " + x.nota.toFixed(1).replace(".",",") : "terminado") : "sin hacer"}</li>`; }).join("");
  app.innerHTML = `${hud()}
    <div class="card"><h2 style="margin:0;font-size:30px">👪 Familia</h2>
      <p style="margin:6px 0">Partidas: <b>${S.games}</b> · Aciertos totales: <b>${S.totalOk}</b> · Racha: <b>${S.streak.days} días</b></p>
      <p style="margin:6px 0">Vales: <b>${S.tickets.earned}</b> ganados, <b>${S.tickets.redeemed.length}</b> canjeados</p>
      <ul style="margin:6px 0;padding-left:20px">${exams}</ul>
      <p class="hint">Las respuestas de cada examen están al final del examen, con el mismo código.</p>
      <div class="row">
        <button class="btn ghost" onclick="S.tickets.earned++;save();render()">🎁 Regalar un vale</button>
        <button class="btn ghost" onclick="testSound()">🔔 Probar sonido</button>
        <button class="btn ghost" onclick="S.sound=!S.sound;if(!S.sound)stopMusic();save();render()">${S.sound?"🔊 Sonido sí":"🔇 Sonido no"}</button>
        <button class="btn ghost" onclick="if(confirm('¿Borrar TODO el progreso de la app? (los exámenes no se borran)')){S=blank();save();familyOpen=false;go('map')}">🗑️ Reiniciar</button>
      </div>
    </div>${subj}`;
}
